    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip
  x-camara-commonalities: wip
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/CommonalitiesTest
servers:
  - url: "{apiRoot}/sample-service-all-definitions/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Areas
    description: Operations on artificial, geometry-bearing area resources
security:
  - openId:
      - sample-service-all-definitions:areas:read
      - sample-service-all-definitions:areas:write
paths:
  /areas:
    post:
      tags:
        - Areas
      summary: Create an area
      description: |
        Creates an artificial area resource. Exists only to reference the
        geometry/location schemas, `Date`, `TimePeriod`, `DeviceResponse`,
        and the phoneNumber-identified `422` response.
      operationId: createArea
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArea"
      responses:
        # 5xx and the other not-documented-by-default statuses (405, 406, 412,
        # 415) are intentionally not declared — see the CAMARA API Design Guide
        "201":
          description: Area created
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResource"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "422":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PhoneNumberIdentifier422"
        "429":
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
    get:
      tags:
        - Areas
      summary: List areas
      description: |
        Returns a filtered, paginated list of artificial area resources.
        `maxRadius` is a range-restricted filter used only to exercise
        `BadRequestWithRange400`.
      operationId: listAreas
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/page"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/perPage"
        - $ref: "#/components/parameters/MaxRadius"
      responses:
        "200":
          description: List of areas
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaList"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
  parameters:
    MaxRadius:
      name: maxRadius
      in: query
      required: false
      description: Only return areas whose circle radius, in meters, does not exceed this value. Values outside the allowed range are rejected with `400 OUT_OF_RANGE`.
      schema:
        type: number
        minimum: 1
        maximum: 5000
  schemas:
    AreaId:
      type: string
      format: uuid
      maxLength: 36
      description: Unique identifier for the area
    CreateArea:
      description: Properties for creating a new area
      type: object
      required:
        - name
        - area
      properties:
        name:
          type: string
          maxLength: 128
          description: Human-readable name for the area
        area:
          $ref: "#/components/schemas/AreaShape"
        activeSince:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Date"
        validity:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/TimePeriod"
        phoneNumber:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/PhoneNumber"
    AreaResource:
      description: An artificial area resource
      type: object
      required:
        - areaId
        - name
        - area
      properties:
        areaId:
          $ref: "#/components/schemas/AreaId"
        name:
          type: string
          maxLength: 128
          description: Human-readable name for the area
        area:
          $ref: "#/components/schemas/AreaShape"
        activeSince:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Date"
        validity:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/TimePeriod"
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"
    AreaList:
      description: Paginated list of areas
      type: object
      required:
        - areas
        - pagination
      properties:
        areas:
          description: List of areas
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AreaResource"
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"
    # Explicit oneOf over both Area variants (rather than relying solely on
    # Area's own discriminator) so both Circle and Polygon — and, through
    # them, PointList/Point/Latitude/Longitude — are directly referenced.
    AreaShape:
      description: The shape of the area, either a circle or a polygon
      oneOf:
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/Circle"
        - $ref: "../common/CAMARA_common.yaml#/components/schemas/Polygon"
      discriminator:
        propertyName: areaType
        mapping:
          CIRCLE: "../common/CAMARA_common.yaml#/components/schemas/Circle"
          POLYGON: "../common/CAMARA_common.yaml#/components/schemas/Polygon"
