# CAMARA Validation Framework — Caller Workflow
#
# Installed in API repositories by the CAMARA onboarding campaign
# (camaraproject/project-administration). No modification needed;
# all configuration is centralized in camaraproject/tooling.
#
# Replaces the legacy pr_validation_caller.yml (v0 validation).

name: CAMARA Validation

on:
  pull_request:
    branches:
      - main
      - release-snapshot/**
      - maintenance/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  checks: write
  pull-requests: write
  issues: write
  contents: read
  statuses: write
  id-token: write

jobs:
  validation:
    uses: camaraproject/tooling/.github/workflows/validation.yml@main
    # Pinned to tooling `main`, not the stable release line a normal API
    # repository uses. This repository exists to canary rules for the upcoming
    # Commonalities release before either side publishes; those rules are
    # authored on tooling `main` and are not yet in a stable ruleset, so pinning
    # the stable line would validate work-in-progress content against a ruleset
    # missing the very rules being canaried.
    #
    # Both the `@main` ref and the `tooling_ref_override` input are required:
    # the input alone still resolves the reusable workflow from the pinned ref.
    with:
      tooling_ref_override: main
    secrets: inherit
